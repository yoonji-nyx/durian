name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # GHCR 이미지 이름은 소문자여야 함. 아래 build 단계에서 소문자로 변환
  REGISTRY: ghcr.io

jobs:
  build:
    # 기본: ubuntu-latest / self-hosted 전환: Repository variable BUILD_RUNNER = ["self-hosted","linux","ec2"]
    runs-on: ${{ fromJSON(vars.BUILD_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Test
        working-directory: app
        run: |
          npm run lint
          npm test

      - id: vars
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 배포 = gitops 저장소의 이미지 태그를 수정해 push (이후 ArgoCD가 반영)
  # 필요: Secret GITOPS_TOKEN (fine-grained PAT, gitops 저장소 Contents: Read and write)
  # 선택: Variable GITOPS_REPO (기본 Jaewoo2580/cicd-platform-gitops)
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Update staging tag in gitops repo
        env:
          GITOPS_REPO: ${{ vars.GITOPS_REPO || 'Jaewoo2580/cicd-platform-gitops' }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          OVERLAY: staging
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then echo "::error::GITOPS_TOKEN secret is not set"; exit 1; fi
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git" gitops
          cd gitops
          f="apps/sample-app/overlays/${OVERLAY}/kustomization.yaml"
          sed -i -E "s|^(\s*newName:).*|\1 ${IMAGE}|; s|^(\s*newTag:).*|\1 ${TAG}|" "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "no change"; exit 0; fi
          git commit -am "deploy(${OVERLAY}): ${TAG} (${GITHUB_REPOSITORY}@${GITHUB_SHA::7})"
          for i in 1 2 3; do
            git push origin HEAD:main && break
            git pull --rebase origin main
          done

  # production Environment에 Required reviewers를 설정하면 승인 후 실행됨
  # prod ArgoCD Application은 수동 Sync이므로 Argo UI에서 Sync해야 실제 반영됨
  deploy-prod:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Update prod tag in gitops repo
        env:
          GITOPS_REPO: ${{ vars.GITOPS_REPO || 'Jaewoo2580/cicd-platform-gitops' }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          OVERLAY: prod
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then echo "::error::GITOPS_TOKEN secret is not set"; exit 1; fi
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git" gitops
          cd gitops
          f="apps/sample-app/overlays/${OVERLAY}/kustomization.yaml"
          sed -i -E "s|^(\s*newName:).*|\1 ${IMAGE}|; s|^(\s*newTag:).*|\1 ${TAG}|" "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "no change"; exit 0; fi
          git commit -am "deploy(${OVERLAY}): ${TAG} (${GITHUB_REPOSITORY}@${GITHUB_SHA::7})"
          for i in 1 2 3; do
            git push origin HEAD:main && break
            git pull --rebase origin main
          done

  notify:
    if: ${{ always() }}
    needs: [build, deploy-staging, deploy-prod]
    uses: ./.github/workflows/_notify.yml
    secrets: inherit
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
